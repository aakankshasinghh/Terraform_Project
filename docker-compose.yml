services:
  db:
    image: postgres:16
    container_name: devops-assessment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - ./db/seed:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d hotel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
